name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kb -d kb_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KB_TEST_DATABASE_URL: postgres://kb:kb@localhost:5432/kb_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      # Latest stable release, not the go.mod minimum: setup-go would install exactly that
      # version (e.g. 1.27.0) and the binaries would miss the patch releases' security fixes.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Shell scripts
        run: bash -n scripts/kb && bash -n scripts/setup.sh
      - name: Plugin manifests are valid JSON
        run: for f in .claude-plugin/*.json .mcp.json hooks/hooks.json; do jq empty "$f"; done
